name: Build unsigned IPA

# Manual-only: produces an unsigned Payload/ IPA of the iOS receiver with the
# hardware keyboard/trackpad preview (upstream PR #316) merged in. Sideloadly
# signs it with a free Apple ID on Windows.
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Use the newest installed Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS receiver (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecariOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            MARKETING_VERSION=1.30.3 CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign (sideloaders need an existing signature to replace)
        run: |
          set -euo pipefail
          APP="$(find build-ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          codesign --force --sign - --timestamp=none "$APP"
          codesign -dvv "$APP" || true
          codesign --verify --verbose=2 "$APP" || true

      - name: Package Payload IPA
        run: |
          set -euo pipefail
          APP="$(find build-ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          rm -rf Payload OpenDisplay-kbd.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry OpenDisplay-kbd.ipa Payload
          ls -lh OpenDisplay-kbd.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-kbd-ipa
          path: OpenDisplay-kbd.ipa
          if-no-files-found: error
          retention-days: 30
